<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GitPulse | See the work behind a GitHub profile</title>
    <meta name="description" content="Look up any GitHub developer and check how many of their commits are real work. Commit authenticity score, repository breakdown and language mix." />
    <meta name="theme-color" content="#F1F3F9" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Social preview (WhatsApp, LinkedIn, X, Slack, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GitPulse" />
    <meta property="og:title" content="GitPulse | See the work behind a GitHub profile" />
    <meta property="og:description" content="Check commit authenticity, repositories and languages for any GitHub developer." />
    <meta property="og:url" content="https://github-analyzer-ashy.vercel.app/" />
    <meta property="og:image" content="https://github-analyzer-ashy.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GitPulse | See the work behind a GitHub profile" />
    <meta name="twitter:description" content="Check commit authenticity, repositories and languages for any GitHub developer." />
    <meta name="twitter:image" content="https://github-analyzer-ashy.vercel.app/og-image.png" />

    <!-- Set the theme before React loads so the page never flashes the wrong colors -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('gp-theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0A0E1D' : '#F1F3F9');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
